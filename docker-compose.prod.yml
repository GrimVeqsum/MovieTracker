x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"


services:
  kafka:
    logging: *default-logging


  library-postgres:
    logging: *default-logging


  library-app:
    logging: *default-logging


  auth-postgres:
    logging: *default-logging


  auth-app:
    environment:
      AUTH_COOKIE_SECURE: "true"
      AUTH_PUBLIC_ORIGIN: https://${MOVIETRACKER_DOMAIN:?MOVIETRACKER_DOMAIN is required}

    logging: *default-logging


  gateway-app:
    environment:
      GATEWAY_TRUSTED_PROXIES: ${MOVIETRACKER_INGRESS_CIDR:-172.30.253.0/29}
    networks:
      - default
      - ingress
    logging: *default-logging


  enrichment-app:
    logging: *default-logging


  telegram-app:
    logging: *default-logging


  caddy:
    networks:
      - ingress
    image: caddy:2.11.4-alpine

    container_name: movietracker-caddy

    environment:
      MOVIETRACKER_DOMAIN: ${MOVIETRACKER_DOMAIN:?MOVIETRACKER_DOMAIN is required}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      gateway-app:
        condition: service_healthy

    logging: *default-logging

    restart: unless-stopped


# Only Caddy and Gateway can join this trusted proxy segment. Backend
# services on the default network cannot supply trusted forwarding headers.
networks:
  ingress:
    ipam:
      config:
        - subnet: ${MOVIETRACKER_INGRESS_CIDR:-172.30.253.0/29}

volumes:
  caddy_data:
  caddy_config:
