services:
  library-postgres:
    image: postgres:18
    container_name: library-postgres
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password
    ports:
      - "5433:5432"
    volumes:
      - library_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U library_user -d library_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  library-migrations:
    image: migrate/migrate:latest
    container_name: library-migrations
    volumes:
      - ./services/library/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://library_user:library_password@library-postgres:5432/library_db?sslmode=disable",
        "up"
      ]
    depends_on:
      library-postgres:
        condition: service_healthy

  library-app:
    build:
      context: ./services/library
      dockerfile: Dockerfile
    container_name: library-app
    environment:
      LIBRARY_HTTP_PORT: 8081
      LIBRARY_DATABASE_URL: postgres://library_user:library_password@library-postgres:5432/library_db?sslmode=disable
      LIBRARY_JWT_SECRET: dev_secret_change_me
    ports:
      - "8081:8081"
    depends_on:
      library-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    
  auth-postgres:
    image: postgres:18
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  auth-migrations:
    image: migrate/migrate:latest
    container_name: auth-migrations
    volumes:
      - ./services/auth/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://auth_user:auth_password@auth-postgres:5432/auth_db?sslmode=disable",
        "up"
      ]
    depends_on:
      auth-postgres:
        condition: service_healthy
  
  auth-app:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: auth-app
    environment:
      AUTH_HTTP_PORT: 8082
      AUTH_DATABASE_URL: postgres://auth_user:auth_password@auth-postgres:5432/auth_db?sslmode=disable
      AUTH_JWT_SECRET: dev_secret_change_me
    ports:
      - "8082:8082"
    depends_on:
      auth-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  library_postgres_data:
  auth_postgres_data: