services:
  kafka:
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
    ports:
      - "127.0.0.1:9092:9092"

  library-postgres:
    ports:
      - "127.0.0.1:5433:5432"

  library-app:
    ports:
      - "127.0.0.1:8081:8081"

  auth-postgres:
    ports:
      - "127.0.0.1:5434:5432"

  auth-app:
    environment:
      AUTH_PUBLIC_ORIGIN: ${MOVIETRACKER_PUBLIC_ORIGIN:-http://localhost:8080}
    ports:
      - "127.0.0.1:8082:8082"

  gateway-app:
    ports:
      - "127.0.0.1:8080:8080"
