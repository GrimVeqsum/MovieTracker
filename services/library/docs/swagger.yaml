basePath: /
definitions:
  httptransport.JSONCheck:
    properties:
      service:
        type: string
      status:
        type: string
    type: object
  movies.Movie:
    properties:
      created_at:
        example: "2026-07-05T20:58:31+03:00"
        type: string
      deleted_at:
        type: string
      id:
        example: 60fe0ecb-7b2d-4d9d-a324-6b15a45a4df5
        type: string
      normalized_title:
        example: interstellar
        type: string
      rating:
        example: 9
        maximum: 10
        minimum: 1
        type: integer
      release_year:
        example: 2014
        type: integer
      review:
        example: Good movie
        type: string
      status:
        enum:
        - unwatched
        - watched
        example: watched
        type: string
      title:
        example: Interstellar
        type: string
      updated_at:
        example: "2026-07-05T20:59:16+03:00"
        type: string
      user_id:
        example: 11111111-1111-1111-1111-111111111111
        type: string
      watched_at:
        example: "2026-07-05T20:58:31+03:00"
        type: string
    type: object
  movies.createMovieRequest:
    properties:
      release_year:
        type: integer
      title:
        type: string
    type: object
  movies.makeWatchedRequest:
    properties:
      rating:
        type: integer
      review:
        type: string
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.ErrorBody'
    type: object
host: localhost:8081
info:
  contact: {}
  description: API for managing user's movie library.
  title: Movie Library API
  version: "1.0"
paths:
  /health:
    get:
      description: Shows health of the services
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.JSONCheck'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Healthcheck of the services
      tags:
      - CheckServicesStatus
  /movies:
    get:
      description: Returns all active movies for authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/movies.Movie'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get movie list
      tags:
      - movies
    post:
      consumes:
      - application/json
      description: Adding new movie to the user's movie list
      parameters:
      - description: Movie data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/movies.createMovieRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/movies.Movie'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create new movie
      tags:
      - movies
  /movies/{id}:
    delete:
      description: Soft deletes movie by id for authenticated user
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete movie
      tags:
      - movies
    get:
      description: Returns one movie by id for authenticated user
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/movies.Movie'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get movie by id
      tags:
      - movies
  /movies/{id}/unwatched:
    patch:
      description: Changes movie status to unwatched and clears rating, review and
        watched_at
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/movies.Movie'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark movie as unwatched
      tags:
      - movies
  /movies/{id}/watched:
    patch:
      consumes:
      - application/json
      description: Changes movie status to watched and saves rating/review
      parameters:
      - description: Movie ID
        in: path
        name: id
        required: true
        type: string
      - description: Watched movie data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/movies.makeWatchedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/movies.Movie'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark movie as watched
      tags:
      - movies
  /movies/random:
    get:
      description: Returns random active movie for authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/movies.Movie'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get random movie
      tags:
      - movies
  /ready:
    get:
      description: Shows readiness of the service and database connection
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.JSONCheck'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Readycheck of the services
      tags:
      - CheckServicesStatus
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and JWT token. Example: "Bearer
      eyJhbGciOi..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
